name: Release

# Tag-driven release. The publish job uses Hex trusted publishing (a Hex
# workload identity): `mix hex.publish` asks GitHub for an OIDC token
# (audience `hexpm`) and trades it for a 15-minute token that can publish
# only `manza`. No HEX_API_KEY exists anywhere; a configured key would take
# precedence over the workload identity, so none is set.
#
# One-time setup on hex.pm (package owner with 2FA): manza → Settings →
# Workload identities: owner `getmanza`, repository `manza-elixir`, workflow
# `release.yml`, environment `hex`. Needs Hex >= 2.6 and OTP 27 in the job.
# A release published this way is staged until a package owner approves it
# on hex.pm (Settings → Staged publishing).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  publish:
    needs: test
    runs-on: ubuntu-26.04
    # The workload identity on hex.pm is bound to this environment name.
    environment: hex
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Workload identity needs Hex >= 2.6 (staged publishing 2.7).
      - run: mix local.hex --force
      - run: mix deps.get
      - name: Verify tag matches package version
        # Ask Mix itself — mix.exs declares the version via a @version module
        # attribute, which a mix.exs grep can't see reliably.
        run: |
          PKG_VERSION=$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])' | tail -1)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag v$TAG_VERSION does not match mix.exs version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Publish to Hex
        # Idempotent: publishing a drafted GitHub release re-fires the tag push,
        # and Hex rejects re-publishing an existing version without --replace.
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STATUS=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/manza/releases/$VERSION")
          if [[ "$STATUS" == "200" ]]; then
            echo "manza $VERSION is already on Hex; skipping publish."
          elif [[ "$STATUS" == "404" ]]; then
            mix hex.publish --yes
          else
            echo "Unable to determine whether manza $VERSION is on Hex (HTTP $STATUS)." >&2
            exit 1
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" --title "$tag" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
