name: Release

# Tag-driven release. Hex.pm has no OIDC trusted publishing, so this is the
# closest equivalent: a short-lived-as-possible HEX_API_KEY repository secret,
# gated behind the `hex` GitHub environment (add required reviewers there for
# a human approval step), plus a GitHub release.
#
# One-time setup: generate a publish key (`mix hex.user key generate
# --permission api:write`) and store it as the HEX_API_KEY secret on the
# `hex` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: hex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - name: Verify tag matches package version
        # Ask Mix itself — mix.exs declares the version via a @version module
        # attribute, which a mix.exs grep can't see reliably.
        run: |
          PKG_VERSION=$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])' | tail -1)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag v$TAG_VERSION does not match mix.exs version $PKG_VERSION" >&2
            exit 1
          fi
      # Hex refuses to overwrite a published version, so a re-run (or a
      # bin/release --force re-cut) skips the publish instead of failing.
      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if curl -fsS -o /dev/null "https://hex.pm/api/packages/manza/releases/$VERSION"; then
            echo "::warning::manza $VERSION is already on Hex, skipping the publish"
          else
            mix hex.publish --yes
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bin/release creates the release (and the tag) itself; only a tag
        # pushed by hand reaches here without one.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published"
          else
            gh release create "$tag" --title "$tag" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          fi
