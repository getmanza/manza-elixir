name: Release

# Tag-driven release. Hex.pm has no OIDC trusted publishing, so this is the
# closest equivalent: a short-lived-as-possible HEX_API_KEY repository secret,
# gated behind the `hex` GitHub environment (add required reviewers there for
# a human approval step), plus a GitHub release.
#
# One-time setup: generate a publish key (`mix hex.user key generate
# --permission api:write`) and store it as the HEX_API_KEY secret on the
# `hex` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  publish:
    needs: test
    runs-on: ubuntu-26.04
    environment: hex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - name: Verify tag matches package version
        # Ask Mix itself — mix.exs declares the version via a @version module
        # attribute, which a mix.exs grep can't see reliably.
        run: |
          PKG_VERSION=$(mix run --no-start --no-compile -e 'IO.puts(Mix.Project.config()[:version])' | tail -1)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag v$TAG_VERSION does not match mix.exs version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Publish to Hex
        # Idempotent: publishing a drafted GitHub release re-fires the tag push,
        # and Hex rejects re-publishing an existing version without --replace.
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STATUS=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/manza/releases/$VERSION")
          if [[ "$STATUS" == "200" ]]; then
            echo "manza $VERSION is already on Hex; skipping publish."
          elif [[ "$STATUS" == "404" ]]; then
            mix hex.publish --yes
          else
            echo "Unable to determine whether manza $VERSION is on Hex (HTTP $STATUS)." >&2
            exit 1
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists; skipping."
            exit 0
          fi
          gh release create "$tag" --title "$tag" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
