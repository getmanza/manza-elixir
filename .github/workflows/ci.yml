name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh

      - name: Restore deps cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            examples/transfer_authorizer/deps
            examples/transfer_authorizer/_build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'examples/transfer_authorizer/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      # The example is its own Mix project ({:manza, path: "../.."}), so its
      # plug, bandit and decimal never reach the published package.
      - name: Example dependencies
        working-directory: examples/transfer_authorizer
        run: mix deps.get

      - name: Example tests
        working-directory: examples/transfer_authorizer
        run: mix test
